# dsh-code-runner bundle patch
#
# dsh-code-runner is built on dsh-better-sidebar. When this patch is applied
# and dsh-better-sidebar is not already mounted, it mounts it first so the
# run button and terminal integration work out of the box.
#
# The fallback uses a private id so it can coexist with the official sidebar
# entry while still letting only the first mount own the singleton service.
- insert:
    - id: code-runner-better-sidebar
      name: 'dsh-better-sidebar'
      disabled: !!js "[...ctx.loader.entries()].find((e) => e.options.name === 'dsh-better-sidebar')?.options.id !== 'code-runner-better-sidebar'"
    - id: dsh-code-runner
      name: 'dsh-code-runner'
